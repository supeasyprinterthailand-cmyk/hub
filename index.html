<!DOCTYPE html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyPrint Product Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312161C'/%3E%3Ctext x='16' y='21' font-family='sans-serif' font-weight='700' font-size='14' fill='%23fff' text-anchor='middle'%3EEP%3C/text%3E%3C/svg%3E">
<script>
/* ===== ตั้งค่า: ลิงก์ Apps Script (Deploy › Web app › URL ลงท้ายด้วย /exec) ===== */
const API = "https://script.google.com/macros/s/AKfycbz6zesxp1fKOTvfhJwSLwuHYQRwfpYlewhpw3Bo8K5Y3kpTE2SvsFycEwda_saa0TFYUQ/exec";
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Anuphan:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: label-sticker catalog — sticky top bar, category shelf, product "labels" with barcode strip, detail sheet with tabs; admin drawer on the right */
:root{
  --bg:#EDF0F3; --paper:#FFFFFF; --paper-2:#F6F8FA; --ink:#12161C; --muted:#5B6674; --line:#D6DCE3;
  --accent:#1F4FD8; --accent-soft:#E3EAFC; --accent-ink:#FFFFFF;
  --warn:#B4232A; --warn-soft:#FBE7E8; --ok:#157A4A; --ok-soft:#E1F3EA; --amber:#9A5B00; --amber-soft:#FCF0DC;
  --ill-body:#DCE2E9; --ill-dark:#38414E; --ill-paper:#FFFFFF; --ill-line:#9AA5B2;
  --f-display:"Chakra Petch","Anuphan",system-ui,sans-serif;
  --f-body:"Anuphan","Noto Sans Thai",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
/* ธีมสว่างเป็นค่าเริ่มต้นเสมอ (ตาม Mockup แบบ A) — ธีมมืดเปิดได้ด้วย data-theme="dark" เท่านั้น */
:root[data-theme="dark"]{
  --bg:#101318; --paper:#1A1E25; --paper-2:#20252D; --ink:#E7EBF0; --muted:#9AA4B1; --line:#2E353F;
  --accent:#7D9BFF; --accent-soft:#1E2846; --accent-ink:#0B1230;
  --warn:#FF8C91; --warn-soft:#3A1D20; --ok:#5ED39A; --ok-soft:#14301F; --amber:#F2B45C; --amber-soft:#3A2A12;
  --ill-body:#3A4350; --ill-dark:#0F1217; --ill-paper:#E7EBF0; --ill-line:#6E7A88; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);cursor:pointer;background:none;border:0;padding:0}
.brand-mark{width:34px;height:34px;border-radius:7px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.02em}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:700;display:block;line-height:1}
.brand small{font-size:12px;color:var(--muted);display:block}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.search input{border:0;background:transparent;outline:0;width:100%}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.small{padding:4px 10px;font-size:13px}
.admin-on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}

/* breadcrumbs */
.crumbs{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding-block:14px 0}
.crumbs button{background:none;border:0;padding:0;color:var(--accent)}

/* home */
.hero{padding-block:28px 8px;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:end}
.hero h1{font-size:clamp(26px,4vw,40px);font-weight:700}
.hero p{color:var(--muted);max-width:60ch;margin:8px 0 0}
.hero-stats{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 16px;min-width:110px}
.stat .n{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1}
.stat .l{font-size:12px;color:var(--muted)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px}
.section-h h2{font-size:20px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.cat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;display:grid;grid-template-rows:auto auto;gap:4px;transition:border-color .15s,transform .15s}
.cat:hover{border-color:var(--accent);transform:translateY(-2px)}
.cat svg{width:100%;height:96px;display:block}
.cat .nm{font-family:var(--f-display);font-weight:600;font-size:16px}
.cat .ct{font-size:12px;color:var(--muted)}

/* product label cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.label{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 0 0;text-align:left;padding:0;display:flex;flex-direction:column;color:var(--ink);transition:transform .15s}
.label:hover{transform:translateY(-2px)}
.label::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-7px;height:8px;background:linear-gradient(-45deg,transparent 5px,var(--paper) 0) 0 0/10px 8px repeat-x,linear-gradient(45deg,transparent 5px,var(--paper) 0) 0 0/10px 8px repeat-x}
.label .pic{background:var(--paper-2);aspect-ratio:16/10;display:grid;place-items:center;border-bottom:1px dashed var(--line);overflow:hidden;max-width:100%}
.label .pic{position:relative}.label .pic img{width:100%;height:100%;object-fit:cover}
.label .pic svg{width:78%;height:auto}
.label .body{padding:12px 14px 14px;display:grid;gap:6px;flex:1;align-content:start}
.label .model{font-family:var(--f-mono);font-weight:600;font-size:15px}
.label .tag{font-size:13px;color:var(--muted);min-height:2.6em}
.barcode{height:22px;display:block;color:var(--ink);opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);color:var(--muted);letter-spacing:.02em}
.chip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.amber{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.cmp-tick{position:absolute;top:8px;right:8px;z-index:2;font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 9px;display:flex;gap:5px;align-items:center}
.cmp-tick input{margin:0}

/* category head */
.cat-head{display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:center;padding-block:18px 6px}
.cat-head svg{width:100%;height:auto}
.cat-head h1{font-size:clamp(24px,3.4vw,34px)}
.cat-head p{color:var(--muted);margin:6px 0 0;max-width:70ch}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}

/* product detail */
.sheet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;padding-block:18px}
.gallery{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.gallery .main{aspect-ratio:4/3;display:grid;place-items:center;background:var(--paper-2);border-radius:8px;overflow:hidden;max-width:100%;position:relative}
.gallery .main img{width:100%;height:100%;object-fit:contain}
.gallery .main svg{width:82%;height:auto}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs button{width:58px;height:58px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--paper-2);overflow:hidden}
.thumbs button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.thumbs img,.thumbs svg{width:100%;height:100%;object-fit:contain}
.note-sim{font-size:12px;color:var(--muted)}
.p-title .model{font-family:var(--f-mono);font-size:clamp(22px,3vw,30px);font-weight:600;line-height:1.15}
.p-title .cat-lbl{font-size:13px;color:var(--accent);font-weight:600}
.p-title p{margin:6px 0 10px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:14px 0}
.quick div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.quick .k{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.quick .v{font-weight:600;font-size:14px}
.variants{display:grid;gap:6px;margin:10px 0}
.variant{display:flex;gap:10px;align-items:baseline;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.variant .mono{font-weight:600;min-width:96px}
.variant span:last-child{font-size:13.5px;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .cnt{font-family:var(--f-mono);font-size:11px;background:var(--paper-2);border-radius:999px;padding:0 6px;margin-left:4px}
.panel{padding-block:16px;min-width:0}
table.spec{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table.spec th,table.spec td{padding:9px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
table.spec th{width:38%;color:var(--muted);font-weight:500;background:var(--paper-2)}
table.spec tr:last-child th,table.spec tr:last-child td{border-bottom:0}
.feat{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.feat li{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px 10px 38px;position:relative}
.feat li::before{content:"";position:absolute;left:14px;top:17px;width:12px;height:7px;border-left:2px solid var(--ok);border-bottom:2px solid var(--ok);transform:rotate(-45deg)}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.sec h3{font-size:15px;padding:10px 14px;background:var(--paper-2);border-bottom:1px solid var(--line)}
.sec ul{margin:0;padding:10px 14px 12px 32px;display:grid;gap:5px}
.sec li{font-size:14px}
.sec.warn h3{background:var(--warn-soft);color:var(--warn)}
.sec.okc h3{background:var(--ok-soft);color:var(--ok)}
.trouble{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
.trouble summary{padding:11px 14px;font-weight:600;cursor:pointer;list-style:none;display:flex;gap:10px;align-items:baseline}
.trouble summary::-webkit-details-marker{display:none}
.trouble summary::before{content:"?";flex:none;width:20px;height:20px;border-radius:50%;background:var(--warn-soft);color:var(--warn);font-size:12px;display:grid;place-items:center;font-family:var(--f-mono)}
.trouble[open] summary{border-bottom:1px dashed var(--line)}
.trouble ol{margin:0;padding:10px 14px 12px 44px;display:grid;gap:4px;font-size:14px}
.simgs{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 12px}.simgs img{width:170px;height:124px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--paper-2);cursor:zoom-in}
.ied .simgs{padding:0}.ied .simgs figure{margin:0;position:relative}.ied .simgs img{width:96px;height:72px;cursor:default}.ied .simgs button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font-size:12px;line-height:1}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.media{display:flex;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-decoration:none;color:var(--ink);min-width:0}
.media:hover{border-color:var(--accent)}
.media .ic{flex:none;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:600}
.ic.video{background:var(--warn-soft);color:var(--warn)}
.ic.file{background:var(--accent-soft);color:var(--accent)}
.ic.link{background:var(--ok-soft);color:var(--ok)}
.ic.image{background:var(--amber-soft);color:var(--amber)}
/* ดาวน์โหลด: การ์ดไฟล์ กดปุ่มโหลดได้เลย */
.dl{display:grid;gap:8px;margin-bottom:16px}
.dl-row{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.dl-row .ext{flex:none;width:46px;height:46px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.02em;background:var(--accent-soft);color:var(--accent)}
.dl-row .ext.pdf{background:var(--warn-soft);color:var(--warn)}.dl-row .ext.zip{background:var(--amber-soft);color:var(--amber)}.dl-row .ext.app{background:var(--ok-soft);color:var(--ok)}
.dl-row .nm{flex:1;min-width:0}.dl-row .nm b{display:block;font-size:14px;line-height:1.3;overflow-wrap:anywhere}.dl-row .nm span{font-size:12px;color:var(--muted)}
.dl-row .acts{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.dl-row .btn.dlb{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);text-decoration:none}
.dl-h{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:15px;margin:14px 0 8px}
.dl-h .cnt{font-family:var(--f-mono);font-size:11px;background:var(--paper-2);border-radius:999px;padding:0 7px;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 10px;font-weight:600;font-size:14px;color:var(--ink);margin:14px 0 2px}
.back:hover{border-color:var(--accent);color:var(--accent)}
.back-bottom{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 8px}
@media (max-width:820px){.dl-row{flex-wrap:wrap}.dl-row .acts{width:100%;justify-content:flex-start}}
.media .t{font-size:13.5px;line-height:1.35;min-width:0;overflow-wrap:anywhere}
.media .d{font-size:11.5px;color:var(--muted)}
.media-group{margin-bottom:16px}
.leds{padding:10px 14px 12px;display:grid;gap:8px;font-size:14px}
.led-row{display:flex;gap:10px;align-items:center}
.dot{flex:none;width:14px;height:14px;border-radius:50%}
.dot.blink{animation:ledblink 1s steps(2,start) infinite}
@keyframes ledblink{to{opacity:.25}}
.sec.led h3{background:var(--paper-2)}
.vol-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.vol-strip>div{padding:12px 14px;border-right:1px solid var(--line);font-size:14px}
.vol-strip>div:last-child{border-right:0;background:var(--ink);color:var(--paper)}
.vol-strip .n{font-family:var(--f-mono);font-size:20px;color:var(--accent)}
.vol-strip>div:last-child .n{color:#9FB5FF}
.vol-strip .l{font-size:12px;color:var(--muted);margin-bottom:6px}
.vol-strip>div:last-child .l{color:#B8C0CC}
@media (max-width:820px){.vol-strip{grid-template-columns:1fr 1fr}.vol-strip>div{border-bottom:1px solid var(--line)}}
.media-group h3{font-size:14px;margin-bottom:8px;color:var(--muted);font-family:var(--f-body);font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:var(--r)}
.soft{color:var(--muted);font-size:13px}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px;font-size:13.5px;color:var(--muted)}
.chiprow span{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.chiprow b{color:var(--ink)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.two .sec{margin-bottom:0}
.side{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;font-size:14px}
.side b.t{font-family:var(--f-display);font-size:15px}
.side .note{font-size:12.5px;color:var(--muted);background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:8px 10px}
.timeline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px 14px 4px}
.timeline>div{background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px}
.timeline .k{font-family:var(--f-mono);font-weight:600;color:var(--accent);font-size:13px;margin-bottom:2px}
.sched{display:grid;gap:6px}
.sched>div{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:start}
.sched .k{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px;text-align:center}
table.mini{width:100%;border-collapse:collapse;font-size:13px}
table.mini th,table.mini td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
table.mini th{color:var(--muted);font-weight:500}
@media (max-width:820px){.two{grid-template-columns:1fr}.timeline{grid-template-columns:1fr}}

/* compare tray */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--ink);color:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px)}
.tray .wrap{display:flex;gap:10px;align-items:center;padding-block:10px;flex-wrap:wrap}
.tray .btn{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.cmp-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
table.cmp{border-collapse:collapse;min-width:100%}
table.cmp th,table.cmp td{padding:9px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13.5px;min-width:170px}
table.cmp thead th{font-family:var(--f-mono);font-size:14px;background:var(--paper-2)}
table.cmp tbody th{color:var(--muted);font-weight:500;background:var(--paper-2);position:sticky;left:0;min-width:140px}
table.cmp td.diff{background:var(--amber-soft)}

/* admin drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.drawer header h2{font-size:18px;flex:1}
.drawer .scroll{overflow-y:auto;padding:16px;display:grid;gap:14px}
.drawer footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;background:var(--paper);border-top:1px solid var(--line);flex-wrap:wrap}
.fld{display:grid;gap:4px}

async function run(fn,...args){
  let r; try{ r=await fetch(API,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args})}); }
  catch(e){ throw new Error("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่"); }
  let j; try{ j=await r.json(); }catch(e){ throw new Error("เซิร์ฟเวอร์ตอบผิดรูปแบบ ("+r.status+") ลอง Deploy เวอร์ชันใหม่"); }
  if(!j.ok) throw new Error(j.error||"ไม่สำเร็จ"); return j.result;
}
function hostOf(url){try{return new URL(url,location.href).host.replace(/^www\./,"")}catch(e){return ""}}

/* barcode strip drawn from the model code */
function barcode(code){
  let x=0, bars="";
  const s=String(code||"EP");
  for(let i=0;i<s.length*3 && x<200;i++){
    const c=s.charCodeAt(i%s.length)+i*7;
    const w=1+(c%3), gap=1+((c>>2)%3);
    bars+=`<rect x="${x}" y="0" width="${w}" height="22" fill="currentColor"/>`; x+=w+gap;
  }
  return `<svg class="barcode" viewBox="0 0 ${x} 22" preserveAspectRatio="none" aria-hidden="true">${bars}</svg>`;
}

/* แปลงลิงก์เป็นลิงก์ฝัง (YouTube / Google Drive / PDF) ถ้าทำไม่ได้คืนค่าว่าง = เปิดแท็บใหม่ */
function embedUrl(url){
  url=String(url||""); let m;
  if((m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/))([\w-]{6,})/))){ const t=(url.match(/[?&#]t=(\d+)/)||[])[1]; return "https://www.youtube.com/embed/"+m[1]+"?rel=0"+(t?"&start="+t:""); }
  if((m=url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([\w-]{10,})/))) return "https://drive.google.com/file/d/"+m[1]+"/preview";
  if(/drive\.google\.com\/drive\/folders\//.test(url)) return "";
  if(/\.pdf(\?|#|$)/i.test(url)) return url;
  return "";
}
function viewer(){
  const v=S.view; if(!v) return "";

  return `<div class="lb" data-lb-close><div class="box ${v.kind==="text"?"txt":""}"><header><b>${esc(v.label||"")}</b>
    ${v.url?`<a class="btn small" href="${esc(v.url)}" target="_blank" rel="noopener">เปิดแท็บใหม่ ↗</a>`:""}<button class="btn small" data-lb-close>ปิด ✕</button></header><div class="body">${body}</div></div></div>`;
}

/* ---------- routing: ?v=c-<cat> | p-<id> | compare (ลิงก์ตรงไปหน้าสินค้าได้) ---------- */
function setRoute(h){
  h=String(h||"");
  if(h.startsWith("c-")) S.route={v:"cat",id:h.slice(2)};
  else if(h.startsWith("p-")) S.route={v:"prod",id:h.slice(2)};
  else if(h==="compare") S.route={v:"compare"};
  else if(h==="learn"||h==="learn-cards"||h==="learn-quiz"||h==="learn-sim"||h==="learn-role"||h==="learn-timed"||h==="learn-cert"||h==="learn-dash"||h==="learn-board"||h==="learn-bank"||h==="learn-users"||h==="learn-plan"||h==="apps") S.route={v:h};
  else S.route={v:"home"};
}
function go(token){
  if(/^compare:/.test(token)){ S.compare=token.slice(8).split(",").filter(Boolean).slice(0,4); saveCompare(); token="compare"; }
  setRoute(token); S.tab="spec"; S.pic=0; S.ie=null; if(S.L){ if(token==="learn-sim") S.L.ss=null; if(token==="learn-role") S.L.rs=null; if(token==="learn-timed") S.L.ts=null; }
  try{ history.pushState({v:token},"",token?"?v="+encodeURIComponent(token):location.pathname); }catch(e){}
  render(); window.scrollTo(0,0);
}
window.addEventListener("popstate",e=>{ setRoute((e.state&&e.state.v)||new URLSearchParams(location.search).get("v")||""); render(); });

function volStrip(s){
  const tiles=s.lines.slice(0,4).map(l=>{const m=l.match(/^(.*?)(?:\s*→\s*)(.*)$/); if(!m) return `<div>${esc(l)}</div>`;
    const head=m[1].split("·"); return `<div><div class="n">${esc(head[0].replace(/ใบ\/วัน/,"").trim())}</div><div class="l">ใบ/วัน${head[1]?" · "+esc(head[1].trim()):""}</div><b>${esc(m[2])}</b></div>`;}).join("");
  const rest=s.lines.slice(4);
  return `<div class="vol-strip">${tiles}</div>`+(rest.length?secBlock({title:"",lines:rest},"okc"):"");
}
/* แถวชิป: "เงื่อนไข → รุ่น" แต่ละบรรทัดเป็นเม็ดเดียว ตัวหนาหลังลูกศร */
function chipRow(s){
  return `<div class="chiprow">${s.lines.map(l=>{const i=l.indexOf("→");return `<span>${i<0?esc(l):esc(l.slice(0,i+1))+" <b>"+esc(l.slice(i+1).trim())+"</b>"}</span>`}).join("")}</div>`;
}
/* แถบไทม์ไลน์ประกัน: บรรทัดที่ขึ้นต้นด้วย "ภายใน/เครื่องมีปัญหาภายใน 7 วัน" หรือ "เกิน …" แยกออกมาเป็นช่อง */
function warBlock(s,cls=""){
  const tl=[],rest=[];
  (s.lines||[]).forEach(l=>{const m=l.match(/^(?:เครื่องมีปัญหา)?(ภายใน\s*7\s*วัน|เกิน\s*[^\s]+(?:\s*(?:วัน|เดือน|ปี))?(?:[–-][^\s]+(?:\s*(?:วัน|เดือน|ปี))?)?)\s*(.*)$/); if(m&&tl.length<3) tl.push([m[1].replace(/ภายใน\s*/,"0–"),m[2]]); else rest.push(l);});
  if(tl.length<2) return secBlock(s,cls);
  return `<div class="sec ${cls}">${s.title?`<h3>${esc(s.title)}</h3>`:""}<div class="timeline">${tl.map(([k,v])=>`<div><div class="k">${esc(k)}</div>${linkify(v)}</div>`).join("")}</div><ul>${rest.map(l=>`<li>${linkify(l)}</li>`).join("")}</ul>${secImgs(s)}</div>`;
}
function secBlock(s,cls=""){
  return `<div class="sec ${cls}">${s.title?`<h3>${esc(s.title)}</h3>`:""}<ul>${(s.lines||[]).map(l=>`<li>${linkify(l)}</li>`).join("")}</ul>${secImgs(s)}</div>`;
}
function linkify(t){
  return esc(t).replace(/(https?:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener" data-view="${u}" data-label="${u}">${u.length>48?u.slice(0,46)+"…":u}</a>`);
}

/* คอลัมน์ซ้ายใต้รูป เปลี่ยนตามแท็บ (ตาม Mockup แบบ A) */
function sidePanel(p,c){
  if(S.tab==="fix") return edWrap("prod",p.id,"leds",ledPanel(p)||(S.admin?`<div class="empty" style="padding:10px">ยังไม่มีคำอธิบายไฟหน้าเครื่อง</div>`:"")) + `<div class="side"><div class="note">แนะนำวิธีไหนให้ลูกค้าแล้วเครื่องเสียหาย คนแนะนำต้องรับผิดชอบ ถ้าไม่มั่นใจให้ส่งตรวจที่ศูนย์</div></div>`;
  if(S.tab==="war"){
    const w=(p.warranty&&p.warranty.length)?p.warranty:(c.warranty||[]);
    const extra=w.filter(s=>/เครื่องสำรอง|นับระยะ/.test(s.title));
    return `<div class="side"><b class="t">ดูประกันของลูกค้ายังไง</b><span class="soft">ดูจากระบบหรือช่องทางที่ซื้อและเลข SN เป็นหลัก <b>ไม่เน้นวอย</b> เพราะเปลี่ยนได้</span>
      <div class="quick" style="margin:4px 0 0"><div><div class="k">วอยสีทอง</div><div class="v">Premium</div></div><div><div class="k">วอยปกติ</div><div class="v">Standard</div></div></div></div>`
      + extra.map(s=>`<div class="side"><b class="t">${esc(s.title)}</b><ul style="margin:0;padding-left:18px;display:grid;gap:4px;font-size:13.5px">${s.lines.map(l=>`<li>${linkify(l)}</li>`).join("")}</ul></div>`).join("");
  }
  if(S.tab==="care"){
    const w=(p.care&&p.care.length)?p.care:(c.care||[]);
    const pick=re=>{for(const s of w){const l=(s.lines||[]).find(x=>re.test(x)); if(l) return l;} return "";};
    const rows=[["ทุกวัน",pick(/ทุกวัน|ประจำวัน|ใช้เสร็จ|ก่อนปิดฝา/)],["สัปดาห์",pick(/สัปดาห์/)],["เดือน",pick(/เดือน/)]].filter(r=>r[1]);
    return rows.length?`<div class="side"><b class="t">ตารางดูแลประจำ</b><div class="sched">${rows.map(([k,v])=>`<div><span class="k">${k}</span><span>${esc(v.replace(/^(ประจำวัน|ประจำสัปดาห์|ประจำเดือน):\s*/,""))}</span></div>`).join("")}</div></div>`:"";
  }
  return "";
}
function ledPanel(p){
  const l=p.leds||[]; if(!l.length) return "";
  const col={red:"var(--warn)",purple:"#8A3FD1",blue:"var(--accent)",green:"var(--ok)"};
  return `<div class="sec led"><h3>ถอดรหัสไฟหน้าเครื่อง</h3><div class="leds">${l.map(x=>{const base=x.color.replace("-blink","");const blink=/blink/.test(x.color);
    return `<div class="led-row"><span class="dot ${blink?"blink":""}" style="background:${col[base]||col.red}"></span><span><b>${esc(x.name)}</b> — ${esc(x.fix)}</span></div>`}).join("")}</div></div>`;
}
function mediaPanel(p){
  const m=p.media||[];
  const sw=(p.software||[]);
  let out="";
  if(sw.length||S.admin) out+=edWrap("prod",p.id,"software",sw.length?`<div class="quick" style="margin-top:0">${sw.map(([k,v])=>`<div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("")}</div>`:`<div class="empty" style="padding:10px">ยังไม่ระบุโปรแกรม/แอปที่ใช้</div>`)+`<div style="height:14px"></div>`;
  const files=m.filter(x=>isDlFile(x.url,x.label)&&!isImgUrl(x.url)), rest=m.filter(x=>!files.includes(x));
  const fg={}; files.forEach(x=>{(fg[x.group||"ไฟล์"] ||= []).push(x)});

/* ย่อรูปให้ด้านยาวไม่เกิน 1600px ก่อนส่ง เพื่อให้อัปโหลดเร็ว */
function readAsB64(file,trim){
  return new Promise((ok,bad)=>{
    const fr=new FileReader(); fr.onerror=bad;
    fr.onload=()=>{
      const url=fr.result;
      if(!/^image\/(jpeg|png|webp)/.test(file.type)) return ok({b64:url.split(",")[1],mime:file.type,name:file.name});
      const img=new Image(); img.onerror=()=>ok({b64:url.split(",")[1],mime:file.type,name:file.name});
      img.onload=()=>{ let sx=0,sy=0,sw=img.width,sh=img.height;
        if(trim){ try{ const b=picBox(img,300); if(b&&b.w*b.h<0.92){ sx=Math.round(b.x*img.width); sy=Math.round(b.y*img.height); sw=Math.round(b.w*img.width); sh=Math.round(b.h*img.height); } }catch(e){} }
        const m=1600, k=Math.min(1,m/Math.max(sw,sh));
        const c=document.createElement("canvas"); c.width=Math.round(sw*k); c.height=Math.round(sh*k);
        const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
        ok({b64:c.toDataURL("image/jpeg",0.86).split(",")[1],mime:"image/jpeg",name:file.name.replace(/\.\w+$/,"")+".jpg"}); };
      img.src=url; };
    fr.readAsDataURL(file);
  });
}
async function upload(files){
  collect(); const e=S.editing; e.uploading=true; render();
  for(const f of files){
    try{
      if(f.size>40*1024*1024){ flash("ไฟล์ "+f.name+" ใหญ่เกิน 40 MB"); continue; }
      const x=await readAsB64(f,f.type.startsWith("image/"));
      const r=await run("uploadFile",S.pw,x.name,x.mime,x.b64);
      if(f.type==="application/pdf"){ e.d.media=(e.d.media||[]).concat([{group:"คู่มือ / ไฟล์",label:f.name,url:r.url}]); }
      else { e.d.images=(e.d.images||[]).concat([r.id]); }
    }catch(err){ flash("อัปโหลดไม่สำเร็จ: "+errMsg(err)); }
  }
  e.uploading=false; render();
  flash("อัปโหลดแล้ว กดบันทึกเพื่อเก็บรูปเข้าสินค้า");
}

function edWrap(kind,id,field,html){
  if(!S.admin) return html;

function ieOpen(kind,id,field){
  const obj=kind==="prod"?prodById(id):catById(id); if(!obj) return;

  else if(field==="chead") draft={name:obj.name,short:obj.short||"",intro:obj.intro||"",icon:obj.icon||obj.id,order:obj.order??10};
  else draft=JSON.parse(JSON.stringify(obj[field]||[]));

  if(FT[field]==="kv" && !draft.length) draft=[["",""]];
  S.ie={kind,id,field,draft,notify:true,note:""}; S.editing=null; render();

    <div style="display:flex;gap:6px"><input name="imgurl" placeholder="หรือวางลิงก์รูปจากเว็บ https://…" value="${esc(S.ie.imgurl||"")}"><button type="button" class="btn small" data-ie-addurl style="white-space:nowrap">+ เพิ่มจากลิงก์</button></div>

/* อ่านค่าที่พิมพ์ในช่องแก้ไขกลับเข้า draft (เรียกก่อน render ทุกครั้ง) */
function ieCollect(){
  const root=$("#ie"); if(!root||!S.ie) return;
  const {field}=S.ie, t=FT[field], all=sel=>[...root.querySelectorAll(sel)];
  const nb=root.querySelector('[name=notify]'); if(nb) S.ie.notify=nb.checked;
  const nt=root.querySelector('[name=note]'); if(nt) S.ie.note=nt.value;
  const nq=root.querySelector('[name=noquiz]'); if(nq) S.ie.noquiz=nq.checked;
  const iu=root.querySelector('[name=imgurl]'); if(iu) S.ie.imgurl=iu.value;
  const v=n=>(root.querySelector(`[name=${n}]`)||{}).value??"";
  if(t==="head") S.ie.draft={name:v("name").trim(),tagline:v("tagline").trim(),conn:v("conn"),badges:v("badges"),volume:v("volume").trim(),order:Number(v("order"))||10};
  else if(t==="chead") S.ie.draft={name:v("name").trim(),short:v("short").trim(),intro:v("intro").trim(),icon:v("icon"),order:Number(v("order"))||10};
  else if(t==="kv") S.ie.draft=all(".kv").map(r=>[r.querySelector("[name=k]").value.trim(),r.querySelector("[name=v]").value.trim()]);
  else if(t==="variants") S.ie.draft=all(".kv").map(r=>({code:r.querySelector("[name=k]").value.trim(),note:r.querySelector("[name=v]").value.trim()}));
  else if(t==="lines") S.ie.draft=parseLines(v("lines"));
  else if(t==="secs"){ const old=S.ie.draft||[]; S.ie.draft=all(".ies").map((r,i)=>({title:r.querySelector("[name=t]").value.trim(),lines:parseLines(r.querySelector("[name=l]").value),imgs:(old[i]&&old[i].imgs)||[]})); }
  else if(t==="media") S.ie.draft=all(".kv3").map(r=>({group:r.querySelector("[name=g]").value.trim(),label:r.querySelector("[name=n]").value.trim(),url:r.querySelector("[name=u]").value.trim()}));
  else if(t==="leds") S.ie.draft=all(".kv3").map(r=>({color:r.querySelector("[name=c]").value,name:r.querySelector("[name=n]").value.trim(),fix:r.querySelector("[name=f]").value.trim()}));
}
function ieAdd(){ ieCollect(); const t=FT[S.ie.field], d=S.ie.draft;
  if(t==="kv") d.push(["",""]); else if(t==="variants") d.push({code:"",note:""}); else if(t==="secs") d.push({title:"",lines:[],imgs:[]});
  else if(t==="media") d.push({group:"",label:"",url:""}); else if(t==="leds") d.push({color:"red",name:"",fix:""}); S.ie.skip=true; render(); }
function ieRm(i){ ieCollect(); S.ie.draft.splice(i,1); S.ie.skip=true; render(); }
function ieAddUrl(){ ieCollect(); const u=(S.ie.imgurl||"").trim(); if(!/^https?:\/\//i.test(u)){ flash("ลิงก์รูปต้องขึ้นต้นด้วย http"); return; } S.ie.draft.push(u); S.ie.imgurl=""; S.ie.skip=true; render(); }
/* ข้อความสรุปที่จะส่งเข้าไลน์ (สร้างแบบเดียวกับฝั่งเซิร์ฟเวอร์) */
const FIELD_TH={name:"ชื่อรุ่น",cat:"หมวด",tagline:"คำอธิบายสั้น",conn:"การเชื่อมต่อ",volume:"ปริมาณงาน",badges:"ป้ายจุดเด่น",quick:"ข้อมูลเด่น",variants:"รุ่นย่อย",specs:"สเปก",features:"จุดเด่น",notes:"ข้อควรรู้",software:"โปรแกรม/แอป",media:"คลิป/ไฟล์/ลิงก์",troubles:"วิธีแก้ปัญหา",leds:"ถอดรหัสไฟหน้าเครื่อง",warranty:"ประกัน",care:"การดูแลรักษา",images:"รูปสินค้า",intro:"คำอธิบายหมวด",guide:"วิธีเลือกรุ่น",short:"คำโปรย",icon:"ภาพจำลอง",order:"ลำดับ",why:"คำอธิบายสเปก"};
function lineMsg(kind,obj,base,note){
  const what=kind==="cat"?"หมวดสินค้า":"ข้อมูลสินค้า";
  const lines=[base?"[อัปเดต"+what+"]":"[เพิ่ม"+what+"ใหม่]", (obj.name||obj.id||"")+(kind!=="cat"&&catById(obj.cat)?" ("+catById(obj.cat).name+")":"")];
  if(base){ const a=kind==="prod"?prodToRow(base):catToRow(base), b=kind==="prod"?prodToRow(obj):catToRow(obj);
    const ch=Object.keys(b).filter(k=>k!=="id"&&String(a[k]??"")!==String(b[k]??"")).map(k=>FIELD_TH[k]||k);
    lines.push(ch.length?"ส่วนที่แก้: "+ch.join(", "):"(ยังไม่มีส่วนที่เปลี่ยน)"); }
  if(note) lines.push("หมายเหตุ: "+note);
  lines.push("ดูข้อมูล: "+(S.url||"<ลิงก์หน้าเว็บ>")+"?v="+(kind==="cat"?"c-":"p-")+(obj.id||"<รหัสใหม่>"));
  return lines.join("\n");
}
function showMsg(text,on){ S.view={kind:"text",text:(on?"":"⚠ ไม่ได้ติ๊กส่งเข้าไลน์ — จะบันทึกอย่างเดียว\n\n")+text,label:"ตัวอย่างข้อความที่จะส่งเข้ากลุ่มไลน์"}; render(); }
function iePreview(){ const o=ieBuild(); if(!o) return; const {kind,id}=S.ie; showMsg(lineMsg(kind,o,kind==="prod"?prodById(id):catById(id),S.ie.note),S.ie.notify!==false); }
function edPreview(){ collect(); const e=S.editing, kind=e.type==="prod"?"prod":"cat"; const base=e.d.id?(kind==="prod"?prodById(e.d.id):catById(e.d.id)):null; showMsg(lineMsg(kind,e.d,base,e.note),e.notify!==false); }
function ieBuild(){
  ieCollect(); const {kind,id,field,draft}=S.ie;
  const base=kind==="prod"?prodById(id):catById(id); const obj=JSON.parse(JSON.stringify(base));
  if(field==="head"){ if(!draft.name){flash("กรุณาใส่ชื่อรุ่น");return null;} Object.assign(obj,{name:draft.name,tagline:draft.tagline,conn:splitC(draft.conn),badges:splitC(draft.badges),volume:draft.volume,order:draft.order}); }
  else if(field==="chead"){ if(!draft.name){flash("กรุณาใส่ชื่อหมวด");return null;} Object.assign(obj,draft); }
  else { let d=draft; if(FT[field]==="kv") d=d.filter(([k])=>k); if(FT[field]==="secs") d=d.filter(x=>x.title||x.lines.length||(x.imgs||[]).length); if(FT[field]==="media") d=d.filter(x=>x.url); if(FT[field]==="variants") d=d.filter(x=>x.code); if(FT[field]==="leds") d=d.filter(x=>x.name); obj[field]=d; }
  return obj;
}
async function ieSave(){
  const obj=ieBuild(); if(!obj) return; const {kind}=S.ie;
  const row=kind==="prod"?prodToRow(obj):catToRow(obj);
  S.ie.saving=true; render();
  try{ const ie=S.ie; applyData(await run("saveRow",S.pw,kind,row,{send:ie.notify!==false,note:ie.note||""}));
    if(ie.noquiz!==undefined){ const key=ie.kind+":"+ie.id+":"+ie.field; const set=qOffSet(); if(ie.noquiz!==set.has(key)){ if(ie.noquiz) set.add(key); else set.delete(key); await setSettingUI("noquiz",JSON.stringify([...set])); } }
    S.ie=null; _aq=null; flash("บันทึกแล้ว"); }
  catch(err){ S.ie.saving=false; flash("บันทึกไม่สำเร็จ: "+errMsg(err)); }
}
async function ieUpload(files){
  ieCollect(); S.ie.uploading=true; render();
  for(const f of files){
    try{
      if(f.size>40*1024*1024){ flash("ไฟล์ "+f.name+" ใหญ่เกิน 40 MB"); continue; }
      const x=await readAsB64(f,S.ie.field==="images"); const r=await run("uploadFile",S.pw,x.name,x.mime,x.b64);
      if(S.ie.field==="images"){ if(f.type.startsWith("image/")) S.ie.draft.push(r.id); }
      else S.ie.draft.push({group:"คู่มือ / ไฟล์",label:f.name,url:r.url});
    }catch(err){ flash("อัปโหลดไม่สำเร็จ: "+errMsg(err)); }
  }
  S.ie.uploading=false; S.ie.skip=true; render(); flash("อัปโหลดแล้ว กดบันทึกเพื่อเก็บเข้าสินค้า");
}

/* รูปประกอบในหัวข้อ (วิธีแก้ปัญหา ประกัน การดูแล ฯลฯ) */
async function ieSecUpload(i,files){
  ieCollect(); S.ie.uploading=i; S.ie.skip=true; render();
  for(const f of files){
    try{ if(f.size>40*1024*1024){ flash("ไฟล์ "+f.name+" ใหญ่เกิน 40 MB"); continue; }
      const x=await readAsB64(f,false); const r=await run("uploadFile",S.pw,x.name,x.mime,x.b64); const sec=S.ie.draft[i]; if(sec) (sec.imgs||(sec.imgs=[])).push(r.id); }
    catch(err){ S.ie.skip=true; flash("อัปโหลดไม่สำเร็จ: "+errMsg(err)); }
  }
  S.ie.uploading=false; S.ie.skip=true; render(); flash("เพิ่มรูปแล้ว กดบันทึกเพื่อเก็บ");
}
document.addEventListener("change",ev=>{ if(ev.target.matches("[data-ie-secimg]")&&ev.target.files.length&&S.ie) ieSecUpload(+ev.target.dataset.ieSecimg,[...ev.target.files]); });
document.addEventListener("click",ev=>{ const t=ev.target.closest("[data-ie-imgrm]"); if(!t||!S.ie) return; ieCollect(); const [i,j]=t.dataset.ieImgrm.split("|").map(Number); const sec=S.ie.draft[i]; if(sec&&sec.imgs) sec.imgs.splice(j,1); S.ie.skip=true; render(); });

let _aq=null,_aqKey=""; function allQuiz(){ const st=S.settings||{}; const k=S.prods.length+":"+S.L.quiz.length+":"+S.cats.length+":"+(st.autoQuiz||"")+":"+(st.noquiz||"")+":"+(st.quizOffProds||""); if(!_aq||_aqKey!==k){ _aq=autoQuiz(); _aqKey=k; } return _aq; }

/* ---------- Flashcard: กำหนดการทบทวน ---------- */
function cardState(id){ return (S.L.prog.cards||{})[id]; }
function dueCards(cards){ const now=Date.now(); return cards.filter(c=>{ const st=cardState(c.id); return st && st.d<=now; }); }
function nextInterval(st,grade){ /* คืนค่า [วัน, ป้าย] */
  const i=st?st.i||0:0;
  if(grade==="again") return [0,"ถามอีกใน 10 นาที"];
  if(grade==="hard") return [i<=1?1:Math.round(i*1.3),"พรุ่งนี้"];
  if(grade==="good") return [i===0?1:(i===1?4:Math.round(i*2.5)),""];
  return [i===0?4:Math.round(Math.max(i,4)*3),""];
}
function intervalLabel(days,fallback){ if(fallback) return fallback; return days===1?"พรุ่งนี้":`อีก ${days} วัน`; }
function gradeCard(id,grade){
  const st=cardState(id)||{i:0,d:0,s:0,l:0}; const [days]=nextInterval(st,grade);
  const now=Date.now();
  if(grade==="again"){ st.i=0; st.s=0; st.l=(st.l||0)+1; st.d=now+10*60000; }
  else { st.i=days; st.s=(st.s||0)+1; st.d=now+days*DAY; }
  S.L.prog.cards=S.L.prog.cards||{}; S.L.prog.cards[id]=st;
  const p=S.L.prog; p.today=p.today||{}; p.today[today()]=(p.today[today()]||0)+1; Object.keys(p.today).forEach(k=>{ if(k!==today()) delete p.today[k]; });
  markDay(); progSave();
  const ses=S.L.cs; ses.done++;
  if(grade==="again") ses.queue.push(ses.queue[ses.idx]); /* เอากลับมาถามอีกท้ายรอบ */
  ses.idx++; ses.flip=false; render(); window.scrollTo(0,0);
}
function buildCards(topic,prod){
  let cards=autoCards();
  if(prod) cards=cards.filter(c=>c.prod===prod || (!c.prod && c.cat===(prodById(prod)||{}).cat));
  if(topic) cards=cards.filter(c=>c.topic===topic);
  const now=Date.now();
  const due=cards.filter(c=>{ const st=cardState(c.id); return st && st.d<=now; }).sort((a,b)=>cardState(a.id).d-cardState(b.id).d);
  const fresh=shuffle(cards.filter(c=>!cardState(c.id))).slice(0,10);
  const queue=due.slice(0,20).concat(fresh).slice(0,25);
  return {queue,idx:0,flip:false,done:0,topic,prod,total:queue.length};
}
function startCards(topic,prod){ S.L.cs=buildCards(topic,prod); go("learn-cards"); }

  else if(mode==="cmp") qs=qs.filter(q=>q.topic==="cmp");
  else if(mode==="wrong"){ const w=S.L.prog.wrong||{}; qs=qs.filter(q=>w[q.id]); }
  if(!qs.length){ flash("ยังไม่มีคำถามสำหรับโหมดนี้"); return; }
  const items=shuffle(qs).slice(0,10).map(q=>{ const order=shuffle(q.opts.map((_,i)=>i)); return {q,order,pick:null}; });
  S.L.qs={mode,prod,items,idx:0,start:Date.now(),done:false,notify:true,addCards:true,saved:false};
  go("learn-quiz");
}
function pickAnswer(i){
  const ses=S.L.qs; const it=ses.items[ses.idx]; if(it.pick!==null) return;
  it.pick=i; it.ok = it.order[i]===it.q.ans;
  if(!it.ok){ S.L.prog.wrong=S.L.prog.wrong||{}; S.L.prog.wrong[it.q.id]=Date.now(); }
  else if(ses.mode==="wrong"){ delete (S.L.prog.wrong||{})[it.q.id]; }
  render();
}
async function finishQuiz(){
  const ses=S.L.qs; if(ses.saved) return; ses.saved=true;
  const score=ses.items.filter(x=>x.ok).length, total=ses.items.length, seconds=Math.round((Date.now()-ses.start)/1000);
  const wrong=ses.items.filter(x=>x.pick!==null&&!x.ok).map(x=>x.q.q.slice(0,60));
  const label=ses.mode==="prod"?"แบบทดสอบ "+prodName(ses.prod):MODE_TH(ses.mode);
  const p=S.L.prog; p.quiz=(p.quiz||[]).concat([{ts:Date.now(),mode:ses.mode,prod:ses.prod||"",score,total,seconds}]).slice(-30); markDay();
  if(!ses.addCards){ ses.items.filter(x=>!x.ok).forEach(x=>{ delete (p.wrong||{})[x.q.id]; }); }
  progSave(true);
  try{ await run("saveQuizResult",S.L.user,{mode:ses.mode,prod:ses.prod||"",label,score,total,wrong,seconds},{send:ses.notify!==false,note:ses.level?(score/total>=PASS?"ผ่านระดับ "+ses.level+" · "+LEVELS[ses.level-1].name:"ยังไม่ผ่านระดับ "+ses.level):""}); S.L.results.push({ts:new Date().toISOString(),user:S.L.user,mode:ses.mode,prod:ses.prod||"",score,total,wrong:wrong.join(" | "),seconds}); flash("บันทึกผลแล้ว"+(ses.notify!==false?" · ส่งสรุปเข้าไลน์แล้ว":"")+afterQuizSaved(ses,score,total)); }
  catch(err){ flash("บันทึกผลไม่สำเร็จ: "+errMsg(err)); }
  render();
}

  else if(f.kind==="flow"){ Object.assign(d,{title:v("title").trim(),steps:v("steps")}); if(!d.title||parseFlow(d.steps).length<2){ flash("ใส่ชื่อชุดและอย่างน้อย 2 ขั้น"); return; } }
  else if(f.kind==="role"){ Object.assign(d,{title:v("title").trim(),customer:v("customer").trim(),level:v("level"),script:v("script")}); if(!d.title||parseRole(d.script).filter(x=>x.opts.length).length<1){ flash("ใส่ชื่อเคสและอย่างน้อย 1 ตอนที่มีตัวเลือก"); return; } }

/* ---------- วางข้อสอบทั้งก้อน → แยกอัตโนมัติ ---------- */
const QL=["ก","ข","ค","ง"];
function quizProdMatch(txt){
  const t=String(txt||"").trim().toLowerCase(); if(!t) return "";
  const norm=x=>String(x||"").toLowerCase().replace(/[\s\-_]/g,"");
  const tn=norm(t); let best="";
  for(const p of S.prods){ const idn=norm(p.id), nn=norm(p.name); if(idn===tn||nn===tn) return p.id; if(!best&&(nn.includes(tn)||tn.includes(nn)||idn.includes(tn)||tn.includes(idn))) best=p.id; }
  return best;
}
function parseQuizText(txt,defProd,defTopic){
  const lines=String(txt||"").replace(/\r/g,"").split("\n").map(l=>l.replace(/\u00a0/g," ").trim());
  const out=[]; let cur=null, last=null, prod=defProd||"", topic=defTopic||"";
  const optIdx=k=>{ k=String(k).toLowerCase(); const i=QL.indexOf(k); if(i>=0) return i; if(/^[a-d]$/.test(k)) return k.charCodeAt(0)-97; if(/^[1-4]$/.test(k)) return +k-1; return -1; };
  const close=()=>{ if(cur&&cur.q&&cur.opts.length>=2){ const o=Object.assign({prod:cur.prod,topic:cur.topic,q:cur.q.trim(),explain:cur.explain.trim(),image:cur.image||""},{a:"",b:"",c:"",d:""}); cur.opts.slice(0,4).forEach((v,i)=>o["abcd"[i]]=v.trim()); let ans=cur.ans; if(ans<0&&cur.ansText){ const at=cur.ansText.toLowerCase(); ans=cur.opts.findIndex(v=>v.toLowerCase()===at); if(ans<0) ans=cur.opts.findIndex(v=>v.toLowerCase().includes(at)||at.includes(v.toLowerCase())); } if(ans<0){ ans=0; o.warn="⚠ ไม่พบเฉลย ใช้ข้อ ก"; } if(ans>3){ ans=0; o.warn="⚠ เฉลยเกิน 4 ตัวเลือก"; } if(cur.opts.length>4) o.warn=(o.warn?o.warn+" ":"")+"⚠ ตัดเหลือ 4 ตัวเลือก"; o.answer=QL[ans]; out.push(o); } else if(cur&&cur.q){ out.push(Object.assign({prod:cur.prod,topic:cur.topic,q:cur.q.trim(),a:cur.opts[0]||"",b:cur.opts[1]||"",c:"",d:"",answer:"ก",explain:cur.explain.trim(),image:cur.image||"",warn:"⚠ ตัวเลือกไม่ครบ 2 ข้อ"},{})); } cur=null; last=null; };
  const open=()=>{ if(!cur) cur={prod,topic,q:"",opts:[],ans:-1,ansText:"",explain:"",image:""}; };
  for(const raw of lines){
    if(!raw){ if(cur&&cur.q&&cur.opts.length>=2&&(cur.ans>=0||cur.ansText||cur.explain)) close(); else if(cur) last=null; continue; }
    let m;
    if((m=raw.match(/^(รุ่น(สินค้า)?|รุ่นที่|model)\s*[:：]\s*(.+)$/i))){ const id=quizProdMatch(m[3]); if(cur) cur.prod=id||cur.prod; prod=id||prod; last=null; continue; }
    if((m=raw.match(/^(หมวด|หัวข้อ|topic)\s*[:：]\s*(.+)$/i))){ if(cur) cur.topic=m[2].trim(); topic=m[2].trim(); last=null; continue; }
    if((m=raw.match(/^(รูป(ประกอบ)?|image|img)\s*[:：]\s*(.+)$/i))){ open(); cur.image=m[3].trim(); last=null; continue; }
    if((m=raw.match(/^(เฉลย|คำตอบ|ตอบ|answer|ans)\s*[:：]?\s*(.+)$/i))){ open(); const v=m[2].trim().replace(/^(ข้อ|ตัวเลือก)\s*/,""); const k=v.match(/^([ก-ง]|[a-dA-D]|[1-4])(\s*[.)\]:：]|\s|$)/); if(k&&optIdx(k[1])>=0&&(v.length<=3||/^[ก-ง]|^[a-dA-D]/.test(v))) cur.ans=optIdx(k[1]); else cur.ansText=v; last="ans"; continue; }
    if((m=raw.match(/^(อธิบาย|คำอธิบาย(เฉลย)?|เหตุผล|explain(ation)?|note)\s*[:：]?\s*(.*)$/i))){ open(); cur.explain=(cur.explain?cur.explain+"\n":"")+m[4]; last="explain"; continue; }
    if((m=raw.match(/^(คำถาม|โจทย์|question|q)\s*[:：]\s*(.*)$/i))){ if(cur&&cur.q) close(); open(); cur.q=m[2]; last="q"; continue; }
    const om=raw.match(/^[\(\[]?([ก-ง]|[a-dA-D]|[1-4])\s*[.)\]:：]\s*(.+)$/)||raw.match(/^[-•▪●]\s*(.+)$/);
    if(om){ const isDash=om.length===2; const txt=(isDash?om[1]:om[2]).trim(); const num=!isDash&&/^[1-4]$/.test(om[1]);
      const expect=cur?cur.opts.length:0;
      const asOpt=isDash||!num||(cur&&cur.q&&expect<4&&optIdx(om[1])===expect&&(cur.ans<0&&!cur.ansText));
      if(asOpt){ open(); if(!cur.q){ cur.q=txt; last="q"; continue; } const star=/\s*[*✓✔]\s*$|^\s*[*✓✔]\s*/.test(txt); const clean=txt.replace(/\s*[*✓✔]\s*$/,"").replace(/^\s*[*✓✔]\s*/,"").trim(); cur.opts.push(clean); if(star) cur.ans=cur.opts.length-1; last="opt"; continue; }
    }
    const qn=raw.match(/^(ข้อ(ที่)?\s*)?(\d+)\s*[.)\]:：]\s*(.+)$/);
    if(qn){ if(cur&&cur.q) close(); open(); cur.q=qn[4]; last="q"; continue; }
    open();
    if(last==="explain") cur.explain+="\n"+raw;
    else if(!cur.q){ cur.q=raw; last="q"; }
    else if(last==="q"&&!cur.opts.length) cur.q+="\n"+raw;
    else if(last==="opt"&&cur.opts.length){ cur.opts[cur.opts.length-1]+=" "+raw; }
    else if(cur.opts.length>=2&&(cur.ans>=0||cur.ansText)){ cur.explain=(cur.explain?cur.explain+"\n":"")+raw; last="explain"; }
    else { cur.q+="\n"+raw; last="q"; }
  }
  close(); return out;
}

/* =====================================================================
   ศูนย์เรียนรู้ (ชุด 2): จำลองการติดตั้ง/ตั้งค่า (มีทางแยก) + ดูภาพแล้วตอบ + ส่งเคสภาพ
   ===================================================================== */
/* รูปแบบข้อความของชุดจำลอง (ชีต Flows คอลัมน์ steps):
   ## รหัสขั้น | ชื่อขั้น        ← ขึ้นต้นขั้นใหม่ (รหัสเว้นได้ ระบบตั้งให้ s1, s2 …)
   ข้อความอธิบาย (กี่บรรทัดก็ได้)
   img: ID รูปใน Drive หรือลิงก์รูป
   hint: คำใบ้ (โชว์เฉพาะโหมดฝึก)
   ? คำถามสถานการณ์
   - ตัวเลือก -> รหัสขั้นที่จะไป            (หรือ -> next = ขั้นถัดไป)
   - ตัวเลือก !-> รหัสขั้น | คำอธิบาย        (! = ทางผิด นับเป็นพลาด 1 ครั้ง)
   [] รายการเช็กลิสต์ (ใช้ในขั้นสุดท้าย)
*/
function parseFlow(txt){
  const steps=[]; let cur=null, n=0;
  String(txt||"").split("\n").forEach(raw=>{
    const l=raw.trim(); if(!l) return;
    if(l.startsWith("## ")){ const h=l.slice(3).split("|").map(x=>x.trim()); n++; cur={id:h.length>1?h[0]:"s"+n,title:h.length>1?h[1]:h[0],text:[],img:"",hint:"",q:"",opts:[],checks:[]}; if(h.length===1) cur.id="s"+n; steps.push(cur); return; }
    if(!cur){ n++; cur={id:"s"+n,title:"ขั้นที่ "+n,text:[],img:"",hint:"",q:"",opts:[],checks:[]}; steps.push(cur); }
    let m;
    if((m=l.match(/^img:\s*(.+)$/i))) cur.img=m[1].trim();
    else if((m=l.match(/^hint:\s*(.+)$/i))) cur.hint=m[1].trim();
    else if(l.startsWith("? ")) cur.q=l.slice(2).trim();
    else if(l.startsWith("[]")) cur.checks.push(l.slice(2).trim());
    else if((m=l.match(/^[-•]\s*(.+?)\s*(!?)->\s*([^|]+?)\s*(?:\|\s*(.*))?$/))) cur.opts.push({label:m[1],bad:m[2]==="!",to:m[3].trim(),note:m[4]||""});
    else cur.text.push(l);
  });
  return steps;
}
function flowToText(steps){
  return (steps||[]).map(s=>[`## ${s.id} | ${s.title}`,...(s.text||[]),s.img?`img: ${s.img}`:"",s.hint?`hint: ${s.hint}`:"",s.q?`? ${s.q}`:"",...(s.opts||[]).map(o=>`- ${o.label} ${o.bad?"!":""}-> ${o.to}${o.note?" | "+o.note:""}`),...(s.checks||[]).map(c=>`[] ${c}`)].filter(Boolean).join("\n")).join("\n\n");
}

function allFlows(){
  const custom=(S.L.flows||[]).map(r=>({id:"x:"+r.id,prod:String(r.prod||""),title:String(r.title||""),steps:parseFlow(r.steps),custom:r})).filter(f=>f.steps.length);
  const auto=S.prods.map(autoFlow).filter(Boolean);

function startSim(fid,mode){
  const f=allFlows().find(x=>x.id===fid); if(!f){ flash("ไม่พบชุดจำลองนี้"); return; }
  go("learn-sim");
  S.L.ss={flow:f,cur:f.steps[0].id,path:[],visited:{},mistakes:0,start:Date.now(),mode:mode||"train",done:false,msg:"",checks:{},saved:false,notify:true}; render();
}
function simStep(id){ return S.L.ss.flow.steps.find(s=>s.id===id); }
/* ขั้นทางแยก = ขั้นที่ถูกชี้ด้วยตัวเลือกทางผิด (!->) หรือตั้งชื่อขึ้นต้น led/fix */
function isBranch(f,id){ return /^(led|fix)\d/.test(id) || f.steps.some(s=>(s.opts||[]).some(o=>o.bad&&o.to===id)); }
const mainSteps = f => f.steps.filter(s=>!isBranch(f,s.id));
function simGo(target,bad,note){
  const ss=S.L.ss, f=ss.flow; const i=f.steps.findIndex(s=>s.id===ss.cur);
  if(bad){ ss.mistakes++; ss.msg=note||"ทางนี้ไม่ใช่ที่แนะนำ ลองดูคำอธิบายในขั้นนี้แล้วเลือกใหม่"; } else ss.msg=note||"";
  ss.visited[ss.cur]=true; ss.path.push(ss.cur);
  let next=null;
  if(target==="next"||!target){ next=f.steps.slice(i+1).find(s=>!isBranch(f,s.id))||null; }
  else if(target==="end") next=null;
  else next=simStep(target)||null;
  if(!next){ ss.done=true; ss.cur=f.steps[f.steps.length-1].id; } else ss.cur=next.id;
  render(); window.scrollTo(0,0);
}

/* =====================================================================
   รูปปกสินค้า: ตัดขอบขาวอัตโนมัติให้ตัวสินค้าเต็มกรอบ
   - ตอนอัปโหลด: ตัดขอบขาวออกก่อนย่อรูป (เฉพาะรูปสินค้า)
   - ตอนแสดงการ์ด: วิเคราะห์ขอบขาวของรูปเดิมแล้วซูมให้พอดี (ถ้าอ่านพิกเซลไม่ได้จะซูมเล็กน้อยแทน)
   ===================================================================== */
function picBox(img,maxW){
  const w=Math.min(maxW||220,img.width||img.naturalWidth), h=Math.max(1,Math.round((img.height||img.naturalHeight)*w/(img.width||img.naturalWidth)));
  const c=document.createElement("canvas"); c.width=w; c.height=h; const g=c.getContext("2d");
  g.fillStyle="#fff"; g.fillRect(0,0,w,h); g.drawImage(img,0,0,w,h);
  const d=g.getImageData(0,0,w,h).data; const rows=new Array(h).fill(0), cols=new Array(w).fill(0);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const i=(y*w+x)*4; if(d[i+3]>24 && (d[i]+d[i+1]+d[i+2])/3<226 && Math.max(Math.abs(d[i]-d[i+1]),Math.abs(d[i+1]-d[i+2]))<200){ rows[y]++; cols[x]++; } }
  /* นับเฉพาะแถว/คอลัมน์ที่มีเนื้อหาจริง (กันเงาจาง ๆ และจุดรบกวนที่ขอบ) */
  const rT=Math.max(2,w*0.015), cT=Math.max(2,h*0.015);
  let y0=rows.findIndex(v=>v>=rT), y1=h-1-[...rows].reverse().findIndex(v=>v>=rT), x0=cols.findIndex(v=>v>=cT), x1=w-1-[...cols].reverse().findIndex(v=>v>=cT);
  if(y0<0||x0<0) return null;
  const bw=(x1-x0+1)/w, bh=(y1-y0+1)/h; if(bw*bh<0.04) return null;
  const px=bw*0.04, py=bh*0.04;
  return {x:Math.max(0,x0/w-px),y:Math.max(0,y0/h-py),w:Math.min(1,bw+px*2),h:Math.min(1,bh+py*2),R:(img.width||img.naturalWidth)/(img.height||img.naturalHeight)};
}
const FIT={};
function fitPics(){
  $$("img[data-fit]").forEach(el=>{
    const src=el.dataset.fit; if(el.dataset.fitted===src) return; el.dataset.fitted=src;
    const apply=b=>{ if(!document.contains(el)) return;
      if(!b){ el.style.transform="scale(1.12)"; return; }
      const A=parseFloat(el.dataset.fa)||1.6, r=b.R*b.w/b.h; let W,H,L,T;
      if(r>=A){ H=100/b.h; W=H*b.R/A; L=-b.x*W+(100-b.w*W)/2; T=-b.y*H; } else { W=100/b.w; H=W*A/b.R; L=-b.x*W; T=-b.y*H+(100-b.h*H)/2; }
      Object.assign(el.style,{position:"absolute",width:W+"%",height:H+"%",left:L+"%",top:T+"%",maxWidth:"none",objectFit:"fill",transform:"none"}); };
    if(src in FIT) return apply(FIT[src]);
    const did=(src.match(/thumbnail\?id=([^&]+)/)||[])[1]; const ck=did?"ep-fit2:"+decodeURIComponent(did):"";
    if(ck){ try{ const c=localStorage.getItem(ck); if(c){ FIT[src]=JSON.parse(c); return apply(FIT[src]); } }catch(e){} }
    const done=b=>{ FIT[src]=b; if(ck&&b){ try{ localStorage.setItem(ck,JSON.stringify(b)); }catch(e){} } apply(b); };
    const viaServer=()=>{ if(!did){ done(null); return; } run("getThumb",decodeURIComponent(did)).then(data=>{ const im2=new Image(); im2.onload=()=>{ try{ done(picBox(im2,220)); }catch(e){ done(null); } }; im2.onerror=()=>done(null); im2.src=data; }).catch(()=>done(null)); };
    const im=new Image(); im.crossOrigin="anonymous";
    im.onload=()=>{ let b=null; try{ b=picBox(im,220); }catch(e){ viaServer(); return; } done(b); };
    im.onerror=viaServer;
    im.src=src;
  });
}

function parseRole(txt){
  const steps=[]; let cur=null, n=0;
  String(txt||"").split("\n").forEach(raw=>{
    const l=raw.trim(); if(!l) return;
    if(l.startsWith("## ")){ n++; cur={id:l.slice(3).split("|")[0].trim()||"s"+n,c:[],coach:"",keys:[],opts:[]}; steps.push(cur); return; }
    if(!cur){ n++; cur={id:"s"+n,c:[],coach:"",keys:[],opts:[]}; steps.push(cur); }
    let m;
    if((m=l.match(/^c:\s*(.+)$/i))) cur.c.push(m[1].trim());
    else if((m=l.match(/^coach:\s*(.+)$/i))) cur.coach=m[1].trim();
    else if((m=l.match(/^key:\s*(.+)$/i))) cur.keys=m[1].split(",").map(x=>x.trim()).filter(Boolean);
    else if((m=l.match(/^[-•]\s*(.+?)\s*(!?)->\s*([^|]+?)\s*(?:\|\s*(.*))?$/))) cur.opts.push({label:m[1],bad:m[2]==="!",to:m[3].trim(),note:m[4]||""});
    else cur.c.push(l);
  });
  return steps;
}

const TIMED_LIMIT=60, TIMED_N=5;
const normT=s=>String(s||"").toLowerCase().replace(/[\s.,·\/()\-–—"“”'’:;!?]+/g,"");
function keysOf(ans){ const ks=String(ans).split(/[\s,·\/+()]+/).map(x=>x.trim()).filter(x=>normT(x).length>=2); return ks.length?uniq(ks).slice(0,6):[String(ans)]; }
function startTimed(weak){

  if(weak){ const w=S.L.prog.wrong||{}; const ww=qs.filter(q=>w[q.id]); if(ww.length>=3) qs=ww; }
  if(qs.length<1){ flash("ยังไม่มีคำถาม"); return; }
  const items=shuffle(qs).slice(0,TIMED_N).map(q=>({q,ans:q.opts[q.ans],keys:keysOf(q.opts[q.ans]),typed:"",ok:null,secs:0,hit:[],miss:[]}));
  go("learn-timed");
  S.L.ts={items,idx:0,qStart:Date.now(),start:Date.now(),done:false,saved:false,notify:true,weak:!!weak,search:""}; render();
}
function timedGrade(it,timeout){
  const ts=S.L.ts; if(it.ok!==null) return;
  it.typed=String((($("#ttxt")||{}).value||"")).trim(); it.secs=Math.min(TIMED_LIMIT,Math.round((Date.now()-ts.qStart)/1000)); it.timeout=!!timeout;
  const n=normT(it.typed); it.hit=it.keys.filter(k=>n.includes(normT(k))); it.miss=it.keys.filter(k=>!it.hit.includes(k));
  it.ok=!timeout && it.typed.length>0 && (n.includes(normT(it.ans)) || it.hit.length>=Math.ceil(it.keys.length/2));
  if(!it.ok){ S.L.prog.wrong=S.L.prog.wrong||{}; S.L.prog.wrong[it.q.id]=Date.now(); }
}

function timedBoard(){
  const by={}; S.L.results.filter(r=>r.mode==="timed"&&+r.total).forEach(r=>{ const a=by[r.user]||(by[r.user]={u:r.user,best:null,n:0}); a.n++; const per=(+r.seconds||0)/(+r.total), sc=(+r.score||0)/(+r.total); if(!a.best||sc>a.best.sc||(sc===a.best.sc&&per<a.best.per)) a.best={sc,per}; });

function timedSearch(q){

function userLevel(prog){ const lv=(prog&&prog.levels)||{}; let n=0; for(let i=1;i<=5;i++){ if(lv[i]) n=i; else break; } return n; }
function levelExpired(prog,n){ const ts=((prog&&prog.levels)||{})[n]; return ts? Date.now()-ts>LV_DAYS*86400000 : false; }
function myContrib(user){ return [...(S.L.quiz||[]),...(S.L.cards||[])].filter(r=>String(r.by||"")===user&&String(r.status||"")!=="pending").length; }
/* เงื่อนไขก่อนสอบแต่ละระดับ — คืน [{t, v, p(0-100)}] */
function levelReqs(n,prog,user){
  const q=(prog.quiz||[]); const cardsDone=Object.keys(prog.cards||{}).length;
  const cnt=(f)=>q.filter(f).length;
  if(n===1) return [
    {t:"ทบทวน Flashcard อย่างน้อย 30 ใบ",v:`${Math.min(cardsDone,30)}/30`,p:pct(Math.min(cardsDone,30),30)},
    {t:"ทำแบบทดสอบ (รายรุ่น/สุ่ม) ≥ 80% อย่างน้อย 2 ชุด",v:`${Math.min(cnt(x=>(x.mode==="prod"||x.mode==="random")&&x.score/x.total>=PASS),2)}/2`,p:pct(Math.min(cnt(x=>(x.mode==="prod"||x.mode==="random")&&x.score/x.total>=PASS),2),2)}];
  if(n===2) return [
    {t:"จำลองติดตั้งโหมดสอบ ผิดทางไม่เกิน 1 ครั้ง · 3 ชุด",v:`${Math.min(cnt(x=>x.mode==="sim"&&x.total-x.score<=1),3)}/3`,p:pct(Math.min(cnt(x=>x.mode==="sim"&&x.total-x.score<=1),3),3)},
    {t:"ตอบลูกค้าใน 60 วิ ได้ ≥ 4/5 · 1 รอบ",v:`${Math.min(cnt(x=>x.mode==="timed"&&x.score/x.total>=PASS),1)}/1`,p:pct(Math.min(cnt(x=>x.mode==="timed"&&x.score/x.total>=PASS),1),1)}];
  if(n===3){ const hasImg=imgCases().length>0; const r=[
    {t:"แบบทดสอบรายรุ่น ≥ 80% · 3 รุ่นต่างกัน",v:`${Math.min(uniq(q.filter(x=>x.mode==="prod"&&x.score/x.total>=PASS).map(x=>x.prod)).length,3)}/3`,p:pct(Math.min(uniq(q.filter(x=>x.mode==="prod"&&x.score/x.total>=PASS).map(x=>x.prod)).length,3),3)},
    {t:"เคสจำลองคุยกับลูกค้า เฉลี่ย ≥ 80% · 3 เคส",v:`${Math.min(cnt(x=>x.mode==="role"&&x.score/x.total>=PASS),3)}/3`,p:pct(Math.min(cnt(x=>x.mode==="role"&&x.score/x.total>=PASS),3),3)}];
    if(hasImg) r.push({t:"ดูภาพแล้วตอบ ถูก ≥ 75% · 1 ชุด",v:`${Math.min(cnt(x=>x.mode==="img"&&x.score/x.total>=0.75),1)}/1`,p:pct(Math.min(cnt(x=>x.mode==="img"&&x.score/x.total>=0.75),1),1)});
    return r; }
  if(n===4) return [{t:"แบบทดสอบประกัน & เคลม ≥ 80% · 2 ชุด",v:`${Math.min(cnt(x=>x.mode==="war"&&x.score/x.total>=PASS),2)}/2`,p:pct(Math.min(cnt(x=>x.mode==="war"&&x.score/x.total>=PASS),2),2)}];
  const c=myContrib(user); return [{t:"ส่งเคสภาพ/คำถามที่หัวหน้าอนุมัติแล้ว 3 รายการ",v:`${Math.min(c,3)}/3`,p:pct(Math.min(c,3),3)}];
}
function levelReady(n,prog,user){ return userLevel(prog)>=n-1 && levelReqs(n,prog,user).every(r=>r.p>=100); }
/* คลังข้อสอบแต่ละระดับ */
function levelPool(n){ const all=allQuiz().filter(q=>!q.image);
  if(n===1) return all.filter(q=>["spec","conn","variant","cmp"].includes(q.topic));
  if(n===2) return all.filter(q=>["led","conn"].includes(q.topic)).concat(all.filter(q=>q.topic==="custom"&&/ติดตั้ง|ตั้งค่า|ไดรเวอร์|wifi|bluetooth/i.test(q.q)));
  if(n===3) return all.filter(q=>["fix","led"].includes(q.topic)).concat(allQuiz().filter(q=>q.image));
  return all.filter(q=>q.topic==="war");
}
function badges(prog,user){
  const q=prog.quiz||[]; const b=[];
  const simProds=uniq(q.filter(x=>x.mode==="sim").map(x=>x.prod)).length; if(simProds>=5) b.push(["ติดตั้งครบ 5 รุ่น","ok"]); else if(simProds>=1) b.push([`ติดตั้งแล้ว ${simProds} รุ่น`,""]);
  const st=streak(); if(st>=30) b.push(["Flashcard 30 วัน","acc"]); else if(st>=7) b.push(["เรียนต่อเนื่อง 7 วัน","acc"]);
  const tb=timedBoard(); if(tb.length&&tb[0].u===user) b.push(["ตอบเร็วสุดของทีม","amber"]);
  const c=myContrib(user); if(c) b.push([`ส่งเคส ${c}`,"ok"]);
  if(q.filter(x=>x.mode==="role"&&x.score===x.total).length>=3) b.push(["คุยกับลูกค้าเต็ม 3 เคส","ok"]);
  return b;
}
function startLevelExam(n){
  const L=LEVELS[n-1]; let pool=levelPool(n); if(pool.length<5){ flash("คลังข้อสอบระดับนี้ยังมีไม่พอ (ต้องมีข้อมูลสินค้าเพิ่ม)"); return; }
  const items=shuffle(pool).slice(0,L.qn).map(q=>{ const order=shuffle(q.opts.map((_,i)=>i)); return {q,order,pick:null}; });
  S.L.qs={mode:L.exam,prod:"",items,idx:0,start:Date.now(),done:false,notify:true,addCards:true,saved:false,level:n};
  go("learn-quiz");
}

  return " · ยังไม่ผ่านระดับ "+ses.level+" (ต้อง ≥ 80%)";
}

/* ---------- มอบหมายบทเรียน (สินค้าใหม่ = บทเรียนใหม่) ---------- */
function lessonParts(p,prog){
  const q=(prog&&prog.quiz)||[]; const parts=[];
  const nCards=autoCards().filter(c=>c.prod===p.id).length;
  const cDone=Object.keys((prog&&prog.cards)||{}).filter(id=>id.split(":")[1]===p.id).length;
  parts.push({t:`Flashcard ${Math.min(cDone,Math.min(10,nCards))}/${Math.min(10,nCards)} ใบ`,ok:nCards===0||cDone>=Math.min(10,nCards)});
  const qz=q.filter(x=>x.mode==="prod"&&x.prod===p.id&&x.score/x.total>=PASS).length; parts.push({t:"แบบทดสอบรุ่นนี้ ≥ 80%",ok:qz>0});
  if(autoFlow(p)) parts.push({t:"จำลองติดตั้ง 1 รอบ",ok:q.some(x=>x.mode==="sim"&&x.prod===p.id)});
  return parts;
}
function lessonDone(p,prog){ return lessonParts(p,prog).every(x=>x.ok); }
function assignList(){ return (S.L.assigns||[]).map(a=>({...a,p:prodById(String(a.prod))})).filter(a=>a.p).sort((a,b)=>String(b.ts).localeCompare(String(a.ts))); }
function assignTiles(){

  return `<div class="section-h"><h2>บทเรียนที่ได้รับมอบหมาย</h2><span class="soft">สินค้าใหม่/อัปเดต · ทำให้ครบภายในกำหนด</span></div><div class="ltiles">${list.map(a=>{ const parts=lessonParts(a.p,S.L.prog), done=parts.filter(x=>x.ok).length, all=lessonDone(a.p,S.L.prog); const late=a.due&&!all&&new Date(a.due)<Date.now();
    return `<div class="ltile ${late?"warn":""}" style="gap:6px"><b>${esc(a.title||"บทเรียนใหม่ · "+a.p.name)}</b><span class="soft">${a.due?`กำหนด ${new Date(a.due).toLocaleDateString("th-TH",{day:"numeric",month:"short"})}${late?" · เลยกำหนด":""}`:""} · ${all?"ครบแล้ว ✓":`ทำแล้ว ${done}/${parts.length}`}</span><div class="pbar"><div style="width:${pct(done,parts.length)}%;background:${all?"var(--ok)":"var(--accent)"}"></div></div>

function uStat(u){
  const rs=u.results; const avg=rs.length?Math.round(100*rs.reduce((a,r)=>a+(+r.score||0)/(+r.total||1),0)/rs.length):0;
  const last=rs.length?rs[rs.length-1].ts:(u.updatedAt||""); const lastD=last?new Date(last):null;
  const days=new Set(u.prog.days||[]); let st=0; let d=new Date(); if(!days.has(dkey(d))) d=new Date(Date.now()-DAY); while(days.has(dkey(d))){ st++; d=new Date(d.getTime()-DAY); }
  const weekActive=lastD&&Date.now()-lastD<7*DAY;
  return {avg,lastD,streak:st,level:userLevel(u.prog),weekActive,n:rs.length};
}
function ago(d){ if(!d) return "ยังไม่เคย"; const h=(Date.now()-d)/36e5; if(h<1) return "เมื่อกี้"; if(h<24) return Math.round(h)+" ชม.ก่อน"; const dd=Math.round(h/24); return dd===1?"เมื่อวาน":dd+" วันก่อน"; }

function whyOf(key,cat){
  const k=String(key||"");
  const custom=((cat&&cat.why)||[]).find(([ck])=>ck&&k.toLowerCase().includes(ck.toLowerCase()));
  if(custom){ const m=String(custom[1]||"").split("|").map(x=>x.trim()); return {meaning:m[0],dir:/^(hi|สูง|มาก)/i.test(m[1]||"")?"hi":/^(lo|ต่ำ|น้อย)/i.test(m[1]||"")?"lo":"",tip:m[2]||"",custom:true}; }
  const d=WHY_DEFAULT.find(([re])=>re.test(k)); return d?{meaning:d[1],dir:d[2],tip:d[3]}:{meaning:"",dir:"",tip:""};
}
const numOf=v=>{ const s=String(v||"").replace(/,/g,""); if(/^(—|-|ไม่มี|n\/a)?$/i.test(s.trim())) return null; const m=s.match(/\d+(\.\d+)?/g); return m?Math.max(...m.map(parseFloat)):null; };
const yesOf=v=>{ const s=String(v||"").trim(); if(/^(ไม่มี|ไม่ได้|ไม่รองรับ|ไม่|no\b|—|-|×)/i.test(s)) return 0; if(/^(มี|ได้|รองรับ|ใช่|yes|✓)/i.test(s)) return 1; return null; };
const fmtN=n=>Number.isInteger(n)?n.toLocaleString("en-US"):String(n);
function cmpRow(key,ps,vals,cat){
  const w=whyOf(key,cat); const nums=vals.map(numOf), yes=vals.map(yesOf);
  let best=[],sentence="";
  if(w.dir&&nums.every(n=>n!==null)&&new Set(nums).size>1){
    const t=w.dir==="hi"?Math.max(...nums):Math.min(...nums); best=nums.map((n,i)=>n===t?i:-1).filter(i=>i>=0);
    const others=nums.map((n,i)=>i).filter(i=>!best.includes(i)); const b=best[0], c=others[0];
    if(c!==undefined){ const r=Math.round(100*Math.abs(nums[b]-nums[c])/Math.max(Math.abs(nums[c]),1e-9)); sentence=`${ps[b].name} ${w.dir==="hi"?"มากกว่า":"น้อยกว่า"} ${ps[c].name} ${r>=200?(nums[b]/Math.max(nums[c],1e-9)).toFixed(1).replace(/\.0$/,"")+" เท่า":r+"%"} (${fmtN(nums[b])} เทียบ ${fmtN(nums[c])})`; }
  } else if(yes.every(y=>y!==null)&&new Set(yes).size>1){
    best=yes.map((y,i)=>y?i:-1).filter(i=>i>=0);
    sentence=`${best.map(i=>ps[i].name).join(", ")} มี · ${yes.map((y,i)=>y?-1:i).filter(i=>i>=0).map(i=>ps[i].name).join(", ")} ไม่มี`;
  }
  return {key,vals,w,best,sentence};
}
function cmpRows(ps){
  const cat=catById(ps[0].cat); const keys=[]; ps.forEach(p=>(p.specs||[]).forEach(([k])=>{ if(k&&!keys.includes(k)) keys.push(k); }));
  const val=(p,k)=>((p.specs||[]).find(s=>s[0]===k)||[])[1]||"";
  return keys.map(k=>cmpRow(k,ps,ps.map(p=>val(p,k)),cat)).filter(r=>new Set(r.vals.map(v=>v||"–")).size>1);
}
function cmpPicks(ps,rows){
  const cat=catById(ps[0].cat);
  return ps.map((p,i)=>{ const why=[]; rows.forEach(r=>{ if(r.best.includes(i)&&r.best.length<ps.length){ const w=whyOf(r.key,cat); why.push(w.tip||("ต้องการ"+r.key+"ที่ดีกว่า")); } });
    (p.badges||[]).forEach(b=>why.push(b)); if(p.volume) why.push("งาน "+p.volume);
    return uniq(why).slice(0,4); });
}
function cmpMsg(ps,rows,picks){
  const L=[`เปรียบเทียบ ${ps.map(p=>p.name).join(" กับ ")}`,""];
  rows.slice(0,12).forEach(r=>{ L.push("• "+r.key+": "+ps.map((p,i)=>`${p.name} = ${r.vals[i]||"–"}`).join(" | ")); if(r.sentence) L.push("   → "+r.sentence); });
  L.push(""); ps.forEach((p,i)=>L.push(`แนะนำ ${p.name} ถ้า: ${picks[i].length?picks[i].join(", "):p.tagline||"ใช้งานทั่วไป"}`));
  L.push("",`รายละเอียด: ${S.url||""}?v=compare`);
  return L.join("\n");
}

      ${r.sentence?`<div style="font-size:14px;color:var(--ok)">${esc(r.sentence)}</div>`:""}
      ${r.w.meaning?`<div style="font-size:14px;color:var(--muted)">${esc(r.w.meaning)}</div>`:`<div class="soft">ยังไม่มีคำอธิบายหัวข้อนี้${S.admin?" · กด ✎ เพื่อเขียน":""}</div>`}

  const html=`<div class="section-h"><h2>ทำไมถึงต่าง</h2><span class="soft">★ = ดีกว่าในหัวข้อนั้น · อธิบายให้ลูกค้าเข้าใจได้ทันที</span></div>${body}${pick}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" data-cmp-copy>${lIcon("send")} คัดลอกข้อความส่งลูกค้า</button><button class="btn" data-learn-quiz="cmp">ทดสอบ: รุ่นไหนต่างตรงไหน</button></div>`;
  return (S.admin&&sameCat&&cat)?edWrap("cat",cat.id,"why",html):html;

function cmpNear(id){
  const p=prodById(id); if(!p) return; const sib=prodsOf(p.cat); const i=sib.findIndex(x=>x.id===id);
  const near=sib.filter(x=>x.id!==id).sort((a,b)=>Math.abs(sib.indexOf(a)-i)-Math.abs(sib.indexOf(b)-i)).slice(0,2);
  if(!near.length){ flash("หมวดนี้มีรุ่นเดียว ยังเทียบไม่ได้"); return; }
  S.compare=[id,...near.map(x=>x.id)]; saveCompare(); go("compare");
}
async function cmpCopy(){
  const ps=S.compare.map(prodById).filter(Boolean); if(!ps.length) return;
  const rows=cmpRows(ps), text=cmpMsg(ps,rows,cmpPicks(ps,rows));
  let ok=false; try{ await navigator.clipboard.writeText(text); ok=true; }catch(e){}
  S.view={kind:"text",text,label:ok?"คัดลอกแล้ว — วางส่งลูกค้าได้เลย":"ข้อความส่งลูกค้า (กดค้างเพื่อคัดลอก)"}; render();
}
/* คำถามอัตโนมัติ "รุ่นไหนต่างตรงไหน" (เรียกจาก autoQuiz) */
function cmpQuiz(out,offP,off){ offP=offP||new Set(); off=off||new Set();
  S.cats.forEach(c=>{ const ps=prodsOf(c.id).filter(p=>!offP.has(p.id)&&!off.has("prod:"+p.id+":specs"));
    for(let i=0;i<ps.length-1;i++){ const a=ps[i],b=ps[i+1]; let n=0;
      (a.specs||[]).forEach(([k,v])=>{ if(n>=3) return; const w=whyOf(k,c); if(!w.dir) return;
        const v2=((b.specs||[]).find(s=>s[0]===k)||[])[1]; if(/[×x]/i.test(v+v2)) return; const x=numOf(v),y=numOf(v2); if(x===null||y===null||x===y) return; n++;
        const hi=w.dir==="hi"; const win=(x>y)===hi?a:b, lose=win===a?b:a; const ex=`${a.name}: ${v} · ${b.name}: ${v2}${w.meaning?" — "+w.meaning:""}`;
        out.push({id:`cmp:${a.id}:${b.id}:${k}`,prod:a.id,cat:c.id,topic:"cmp",q:`ระหว่าง ${a.name} กับ ${b.name} รุ่นไหน “${k}” ${hi?"สูงกว่า":"น้อยกว่า"}?`,opts:[win.name,lose.name],ans:0,explain:ex,link:"compare:"+a.id+","+b.id});
        if(w.tip) out.push({id:`cmpt:${a.id}:${b.id}:${k}`,prod:a.id,cat:c.id,topic:"cmp",q:`ลูกค้าบอกว่า “${w.tip}” ระหว่าง ${a.name} กับ ${b.name} ควรแนะนำรุ่นไหน?`,opts:[win.name,lose.name],ans:0,explain:ex,link:"compare:"+a.id+","+b.id});
      }); } });
}

const PTS_RULES=[["ทำแบบทดสอบ/กิจกรรม 1 ชุด","คะแนนที่ได้ ×10 (เต็ม 10) · ผ่าน ≥ 80% +5"],["จำลองติดตั้ง / คุยกับลูกค้า","+2 ต่อชุด (ใช้เวลาเยอะกว่า)"],["สอบผ่านระดับ","+30"],["ส่งความรู้ที่หัวหน้าอนุมัติ","+15 ต่อรายการ"]];
function monthKey(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function boardStats(month){
  const by={}; const add=(u,f)=>{ if(!u) return; const a=by[u]||(by[u]={u,pts:0,n:0,sum:0,contrib:0,lv:0,pass:0}); f(a); };
  (S.L.results||[]).forEach(r=>{ if(month&&String(r.ts).slice(0,7)!==month) return; if(!+r.total) return; const sc=(+r.score||0)/(+r.total);
    add(r.user,a=>{ a.n++; a.sum+=sc; let p=Math.round(sc*10); if(sc>=PASS) p+=5; if(r.mode==="role"||r.mode==="sim") p+=2; if(/^lv/.test(r.mode)&&sc>=PASS){ p+=30; a.pass++; } a.pts+=p; }); });
  [...(S.L.quiz||[]),...(S.L.cards||[])].filter(r=>r.by&&String(r.status||"")!=="pending").forEach(r=>{ if(month&&String(r.ts||"").slice(0,7)!==month) return; add(r.by,a=>{ a.contrib++; a.pts+=15; }); });
  (S.L.team||[]).forEach(t=>{ if(by[t.user]) by[t.user].lv=+t.level||0; });
  return Object.values(by).map(a=>Object.assign(a,{avg:a.n?Math.round(100*a.sum/a.n):0})).sort((a,b)=>b.pts-a.pts||b.avg-a.avg);
}
function myRank(){ const b=boardStats(monthKey()); const i=b.findIndex(x=>x.u===S.L.user); return i<0?null:{rank:i+1,of:b.length,pts:b[i].pts}; }

  const all=S.L.bm==="all"; const month=all?"":monthKey(); const b=boardStats(month); const me=b.findIndex(x=>x.u===S.L.user);

  const contribTop=[...b].filter(x=>x.contrib).sort((a,c)=>c.contrib-a.contrib)[0];
  return learnNav("board")+`<div class="wrap"><button class="back" data-go="learn">‹ กลับศูนย์เรียนรู้</button>
   <div class="section-h"><h2>ลีดเดอร์บอร์ด · ${esc(label)}</h2><span style="display:flex;gap:6px"><button class="btn small ${all?"":"primary"}" data-board-mode="month">เดือนนี้</button><button class="btn small ${all?"primary":""}" data-board-mode="all">ทั้งหมด</button></span></div>
   ${me>=0?`<div style="background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:12px"><b>อันดับของคุณ: #${me+1}</b> จาก ${b.length} คน · ${b[me].pts} คะแนน${me>0?` · ตามอันดับ ${me} อยู่ ${b[me-1].pts-b[me].pts} คะแนน`:" · คุณนำอยู่!"}</div>`:`<div class="empty" style="margin-bottom:12px">ยังไม่มีคะแนนใน${esc(label)} — ทำแบบทดสอบ 1 ชุดหรือส่งความรู้ให้ทีมเพื่อขึ้นกระดาน</div>`}

      ${S.admin?`<div style="padding:10px 14px;border-top:1px solid var(--line)"><button class="btn small" data-board-line>${lIcon("send")} ส่งสรุปอันดับเข้าไลน์ทีม</button></div>`:""}</div>

      ${contribTop?`<div class="side"><b class="t">ผู้ส่งความรู้สูงสุด</b><span>${esc(contribTop.u)} · ${contribTop.contrib} รายการ</span><span class="soft">เคสภาพ คำถาม Flashcard ทริค ที่หัวหน้าอนุมัติแล้ว</span></div>`:""}
      <button class="ltile" data-case-add><span class="ic acc">${lIcon("send")}</span><b>ส่งความรู้ให้ทีม</b><span class="soft">เคสภาพ · คำถาม · Flashcard · ทริค → +15 คะแนนเมื่ออนุมัติ</span></button>
    </div></div><div style="height:40px"></div></div>`;
}
function boardLine(){

}

function planState(prog){
  prog=prog||S.L.prog; const ob=prog.onboard||{};
  const start=prog.onboardStart||((prog.days||[])[0]?Date.parse((prog.days||[])[0]):Date.now());
  const dayNow=Math.max(1,Math.min(ONBOARD.length,Math.floor((Date.now()-start)/DAY)+1));
  const days=ONBOARD.map((d,i)=>{ const tasks=d.tasks.map((t,j)=>({t:t.t,auto:!!t.auto,done:t.auto?!!t.auto(prog):!!ob[`${i+1}-${j}`],key:`${i+1}-${j}`})); return {n:i+1,t:d.t,tasks,done:tasks.every(x=>x.done)}; });
  const doneDays=days.filter(d=>d.done).length; const total=days.reduce((a,d)=>a+d.tasks.length,0), doneT=days.reduce((a,d)=>a+d.tasks.filter(x=>x.done).length,0);
  return {days,dayNow,doneDays,pct:pct(doneT,total),complete:doneDays===ONBOARD.length,start};
}

function planLinks(n){

const SRC_TH={s:"สเปก",l:"ไฟหน้าเครื่อง",t:"วิธีแก้ปัญหา",c:"การเชื่อมต่อ",w:"ประกันรุ่น",cw:"ประกันหมวด",cmp:"เทียบรุ่น",cmpt:"เทียบรุ่น",x:"ทีมเพิ่มเอง"};
function qSource(q){ const pre=String(q.id).split(":")[0]; return SRC_TH[pre]||pre; }
function qOrigin(q){ /* [kind,id,field] ของข้อมูลต้นทาง */
  const [pre,a]=String(q.id).split(":");
  if(pre==="s") return ["prod",a,"specs"]; if(pre==="l") return ["prod",a,"leds"]; if(pre==="t") return ["prod",a,"troubles"]; if(pre==="c") return ["prod",a,"head"]; if(pre==="w") return ["prod",a,"warranty"]; if(pre==="cw") return ["cat",a,"warranty"]; if(pre==="cmp"||pre==="cmpt") return ["prod",a,"specs"]; return null;
}
function overrides(){ const o={}; (S.L.quiz||[]).forEach(r=>{ const id=String(r.id||""); if(id.startsWith("ov:")) o[id.slice(3)]=r; }); return o; }
/* ใช้ใน autoQuiz: ซ่อน/เขียนทับข้อที่ระบบสร้าง */
function applyOverrides(out){
  const ov=overrides(); if(!Object.keys(ov).length) return out;
  return out.filter(q=>{ const r=ov[q.id]; if(!r) return true; if(String(r.status||"")==="hidden"||String(r.status||"")==="deleted") return false;
    const opts=[r.a,r.b,r.c,r.d].map(x=>String(x||"").trim()).filter(Boolean); if(r.q&&opts.length>=2){ const key=String(r.answer||"ก").trim().toLowerCase(); q.q=String(r.q); q.opts=opts; q.ans=Math.min(Math.max(0,{"ก":0,"ข":1,"ค":2,"ง":3,"a":0,"b":1,"c":2,"d":3}[key]??0),opts.length-1); q.explain=String(r.explain||""); if(r.image) q.image=String(r.image); q.override=r; }
    return true; });
}
