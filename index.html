async function appUpload(file,onPct){
  const CH=4*1024*1024; if(!file.size) throw new Error("ไฟล์ว่าง");
  const st=await run("uploadStart",S.pw,file.name,file.type||"application/octet-stream",file.size);
  let pos=0,r=null;
  while(pos<file.size){
    const b64=await blobB64(file.slice(pos,Math.min(pos+CH,file.size)));
    r=await run("uploadChunk",S.pw,st.session,b64,pos,file.size);
    pos=r.done?file.size:r.next; onPct(Math.round(pos/file.size*100));
  }
  if(!r||!r.done) throw new Error("อัปโหลดไม่ครบ"); return r;
}
async function appFilePick(p,file){
  if(!file||!S.A||!S.A.form) return; appCollect();
  const old=S.A.form[p]&&S.A.form[p].id;
  S.A.up[p]={name:file.name,pct:0}; render();
  try{ const r=await appUpload(file,pct=>{ S.A.up[p].pct=pct; const b=$(`[data-app-file="${p}"]`); renderKeep(); });
    S.A.form[p]={id:r.id,name:file.name,size:file.size}; if(old) run("trashAppFile",S.pw,old).catch(()=>{}); flash("อัปโหลด "+file.name+" แล้ว · อย่าลืมกดบันทึก"); }
  catch(err){ flash("อัปโหลดไม่สำเร็จ: "+errMsg(err)); }
  delete S.A.up[p]; render();
}
async function appManualPick(file){
  if(!file||!S.A||!S.A.form) return; appCollect();
  S.A.up.manual={name:file.name,pct:0}; render();
  try{ const r=await appUpload(file,pct=>{ S.A.up.manual.pct=pct; renderKeep(); });
    const label=(S.A.form._ml||"").trim()||file.name.replace(/\.pdf$/i,"");
    S.A.form.manuals=(S.A.form.manuals||[]).concat([{label:label,id:r.id,url:"https://drive.google.com/file/d/"+r.id+"/view",size:file.size}]); S.A.form._ml=""; appClear("manual-label"); flash("เพิ่มคู่มือแล้ว · อย่าลืมกดบันทึก"); }
  catch(err){ flash("อัปโหลดไม่สำเร็จ: "+errMsg(err)); }
  delete S.A.up.manual; render();
}
async function appSave(){
  appCollect(); const f=S.A.form; if(!f) return;
  if(!(f.name||"").trim()){ flash("ใส่ชื่อแอปก่อน"); return; }
  if(Object.keys(S.A.up||{}).length){ flash("รออัปโหลดให้เสร็จก่อน"); return; }
  const obj={id:(f.id||"").trim(),oldId:f.oldId||"",name:f.name.trim(),short:(f.short||"").trim(),version:(f.version||"").trim(),date:f.date||"",notes:f.notes||"",order:f.order||"",status:f.status||"1",color:f.color||"blue",
    android:f.android||null,ios:f.ios||null,windows:f.windows||null,mac:f.mac||null,manuals:f.manuals||[],clips:f.clips||[],notifyLine:!!f.notifyLine};
  S.A.saving=true; render();
  try{ const d=await run("saveApp",S.pw,obj); appsApply(d); flash("บันทึกแล้ว · หน้าลูกค้าอัปเดตภายใน 2 นาที"); }
  catch(err){ S.A.saving=false; flash("บันทึกไม่สำเร็จ: "+errMsg(err)); }
  render();
}
function appClear(...names){ names.forEach(n=>{ const e=$(`#aform [name="${n}"]`); if(e) e.value=""; }); }
function appCopy(text){ const done=()=>flash("คัดลอกแล้ว"); if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done,()=>{ window.prompt("คัดลอกลิงก์นี้",text); }); else window.prompt("คัดลอกลิงก์นี้",text); }
document.addEventListener("submit",ev=>{ if(ev.target.getAttribute&&ev.target.getAttribute("id")==="aform"){ ev.preventDefault(); ev.stopImmediatePropagation(); appSave(); } },true);
document.addEventListener("change",ev=>{
  const t=ev.target; if(!S.A||!S.A.form) return;
  if(t.matches("[data-app-file]")){ const f=t.files&&t.files[0]; appFilePick(t.dataset.appFile,f); }
  if(t.matches("[data-app-manual-file]")){ const f=t.files&&t.files[0]; appManualPick(f); }
});
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-app-reload],[data-app-add],[data-app-edit],[data-app-toggle],[data-app-del],[data-app-cancel],[data-app-url-save],[data-app-line],[data-copy],[data-app-file-del],[data-app-item-del],[data-app-item-up],[data-app-manual-add],[data-app-clip-add]"); if(!t) return; const d=t.dataset;
  if(d.copy!==undefined){ appCopy(d.copy); return; }
  if(!S.A) return;
  if(d.appReload!==undefined){ S.A=null; appsLoad(); return; }
  if(d.appAdd!==undefined){ S.A.form={name:"",short:"",version:"",date:new Date().toISOString().slice(0,10),notes:"",order:String((S.A.apps||[]).length+1),status:"1",color:"blue",manuals:[],clips:[]}; render(); setTimeout(()=>{ const e=$("#aform [name=name]"); e&&e.focus(); },0); return; }
  if(d.appEdit!==undefined){ const a=(S.A.apps||[]).find(x=>String(x.id)===d.appEdit); if(a){ S.A.form=Object.assign({},a,{oldId:a.id,manuals:(a.manuals||[]).slice(),clips:(a.clips||[]).slice()}); render(); window.scrollTo(0,0); } return; }
  if(d.appToggle!==undefined){ const a=(S.A.apps||[]).find(x=>String(x.id)===d.appToggle); if(!a) return; run("saveApp",S.pw,Object.assign({},a,{status:String(a.status||"1")==="0"?"1":"0"})).then(x=>{ appsApply(x); flash(String(a.status||"1")==="0"?"เผยแพร่แล้ว":"ซ่อนแล้ว"); render(); }).catch(err=>flash("ไม่สำเร็จ: "+errMsg(err))); return; }
  if(d.appDel!==undefined){ if(S.A.del!==d.appDel){ S.A.del=d.appDel; render(); return; } run("deleteApp",S.pw,d.appDel).then(x=>{ appsApply(x); flash("ลบแล้ว (ไฟล์ยังอยู่ในโฟลเดอร์ Drive)"); render(); }).catch(err=>flash("ลบไม่สำเร็จ: "+errMsg(err))); return; }
  if(d.appCancel!==undefined){ S.A.form=null; render(); return; }
  if(d.appUrlSave!==undefined){ const u=($("#apps-url")||{}).value||""; run("setSetting",S.pw,"appsUrl",u.trim()).then(()=>{ S.A.appsUrl=u.trim(); S.settings=Object.assign({},S.settings||{},{appsUrl:u.trim()}); flash("บันทึกลิงก์แล้ว"); render(); }).catch(err=>flash("ไม่สำเร็จ: "+errMsg(err))); return; }
  if(d.appLine!==undefined){ const u=appsUrl(); if(!u) return; run("notifyTeam",S.pw,"📲 หน้าโหลดแอป EasyPrint สำหรับส่งให้ลูกค้า\n"+u).then(()=>flash("ส่งเข้าไลน์ทีมแล้ว")).catch(err=>flash("ส่งไม่สำเร็จ: "+errMsg(err))); return; }
  if(!S.A.form) return; appCollect(); const f=S.A.form;
  if(d.appFileDel!==undefined){ const p=d.appFileDel; if(f[p]&&f[p].id) run("trashAppFile",S.pw,f[p].id).catch(()=>{}); f[p]=null; render(); return; }
  if(d.appItemDel!==undefined){ const [k,i]=d.appItemDel.split("|"); const it=(f[k]||[])[+i]; if(it&&it.id) run("trashAppFile",S.pw,it.id).catch(()=>{}); f[k].splice(+i,1); render(); return; }
  if(d.appItemUp!==undefined){ const [k,i]=d.appItemUp.split("|"); const n=+i; if(n>0){ const a=f[k]; [a[n-1],a[n]]=[a[n],a[n-1]]; render(); } return; }
  if(d.appManualAdd!==undefined){ const u=(f._mu||"").trim(); if(!u){ flash("วางลิงก์คู่มือก่อน หรือกด + อัปโหลด PDF"); return; } f.manuals=(f.manuals||[]).concat([{label:(f._ml||"").trim()||"คู่มือ",url:u}]); f._ml=""; f._mu=""; appClear("manual-label","manual-url"); render(); return; }
  if(d.appClipAdd!==undefined){ const u=(f._cu||"").trim(); if(!u){ flash("วางลิงก์ YouTube ก่อน"); return; } f.clips=(f.clips||[]).concat([{label:(f._cl||"").trim()||"คลิปสอน",url:u}]); f._cl=""; f._cu=""; appClear("clip-label","clip-url"); render(); return; }
});

/* ---------- boot ---------- */
setRoute(new URLSearchParams(location.search).get("v")||"");
/* แสดงข้อมูลที่จำไว้ในเครื่องก่อน (เปิดติดทันที) แล้วค่อยดึงของใหม่จากเซิร์ฟเวอร์ */
try{ const c=JSON.parse(localStorage.getItem("ep-data")||"null"); if(c&&c.cats){ applyData(c); S.loading=false; S.stale=true; } }catch(e){}
render();
run("getData").then(d=>{ applyData(d); S.loading=false; S.stale=false; try{ localStorage.setItem("ep-data",JSON.stringify(d)); }catch(e){} render(); })
  .catch(err=>{ if(S.stale){ flash("ใช้ข้อมูลที่จำไว้ล่าสุด: "+errMsg(err)); return; } S.loading=false; S.nodb=true; S.err=errMsg(err); render(); });
</script>
</body></html>
